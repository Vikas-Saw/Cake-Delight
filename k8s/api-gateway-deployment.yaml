apiVersion: apps/v1
kind: Deployment
metadata:
  name: cake-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cake-api-gateway
  template:
    metadata:
      labels:
        app: cake-api-gateway
    spec:
      containers:
        - name: cake-api-gateway
          image: cake-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084

---
apiVersion: v1
kind: Service
metadata:
  name: cake-api-gateway
spec:
  selector:
    app: cake-api-gateway
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
  type: ClusterIP