apiVersion: apps/v1
kind: Deployment
metadata:
  name: cake-notification-service
spec:
  replicas: 1

  selector:
    matchLabels:
      app: cake-notification-service

  template:
    metadata:
      labels:
        app: cake-notification-service

    spec:
      containers:
        - name: cake-notification-service
          image: cake-notification-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8083

          env:
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"

            - name: SPRING_RABBITMQ_PORT
              value: "5672"

            - name: SPRING_RABBITMQ_USERNAME
              value: "cakedelight"

            - name: SPRING_RABBITMQ_PASSWORD
              value: "cakedelight123"

---
apiVersion: v1
kind: Service
metadata:
  name: cake-notification-service
spec:
  selector:
    app: cake-notification-service

  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083

  type: ClusterIP