apiVersion: apps/v1
kind: Deployment
metadata:
  name: cake-order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cake-order-service
  template:
    metadata:
      labels:
        app: cake-order-service
    spec:
      containers:
        - name: cake-order-service
          image: cake-order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://host.docker.internal:3306/order_db"

            - name: SPRING_DATASOURCE_USERNAME
              value: "root"

            - name: SPRING_DATASOURCE_PASSWORD
              value: "Vikas@380"

            # Catalog Service URL
            - name: CATALOG_SERVICE_URL
              value: "http://cake-catalog-service:8080"

            # RabbitMQ Configuration
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"

            - name: SPRING_RABBITMQ_PORT
              value: "5672"

            - name: SPRING_RABBITMQ_USERNAME
              value: "cakedelight"

            - name: SPRING_RABBITMQ_PASSWORD
              value: "cakedelight123"

---
apiVersion: v1
kind: Service
metadata:
  name: cake-order-service
spec:
  selector:
    app: cake-order-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP